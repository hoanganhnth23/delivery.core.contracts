name: Deploy to Google Artifact Registry

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy Maven Artifacts to GAR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Install BOM and Build Parent
        run: |
          git clone --depth 1 https://github.com/hoanganhnth23/delivery.core.starters.git /tmp/starters
          cd /tmp/starters/platform/delivery-platform-bom && mvn -B install -DskipTests
          cd /tmp/starters/platform/delivery-build-parent && mvn -B install -DskipTests

      - name: Deploy to GAR
        run: |
          mvn -B -DskipTests deploy
